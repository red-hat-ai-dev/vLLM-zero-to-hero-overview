name: Validate tutorial

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check shell syntax
        run: |
          for script in *.sh scripts/*.sh; do
            if [ -f "$script" ]; then sh -n "$script" || exit 1; fi
          done
      - name: Run regression and documentation checks (no GPU)
        run: python -m unittest discover -s tests -v
