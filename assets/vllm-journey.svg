<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">The vLLM Zero to Hero journey</title>
  <desc id="description">Four equal steps: Run, Optimize, Benchmark, and Scale.</desc>

  <rect x="1" y="1" width="1198" height="388" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="56" y="60" fill="#ee0000" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">vLLM</text>
  <text x="56" y="105" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">From Zero to Production</text>
  <text x="56" y="133" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="17">Four focused steps for learning modern AI inference</text>
  <line x1="56" y1="158" x2="1144" y2="158" stroke="#ee0000" stroke-width="3"/>

  <g transform="translate(56 184)">
    <rect width="260" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">01</text>
    <text x="68" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Run</text>
    <text x="26" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Start your first model</text>
    <text x="26" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">with vLLM</text>
    <text x="26" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">Part 1</text>
  </g>

  <g transform="translate(332 184)">
    <rect width="260" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">02</text>
    <text x="68" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Optimize</text>
    <text x="26" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Make models faster</text>
    <text x="26" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">and smaller</text>
    <text x="26" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">Part 2</text>
  </g>

  <g transform="translate(608 184)">
    <rect width="260" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">03</text>
    <text x="68" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Benchmark</text>
    <text x="26" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Understand endpoint</text>
    <text x="26" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">performance</text>
    <text x="26" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">Part 3</text>
  </g>

  <g transform="translate(884 184)">
    <rect width="260" height="142" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="32" cy="34" r="20" fill="#ee0000"/>
    <text x="32" y="40" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">04</text>
    <text x="68" y="41" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Scale</text>
    <text x="26" y="79" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">Move toward</text>
    <text x="26" y="101" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="15">production</text>
    <text x="26" y="127" fill="#6e7781" font-family="Arial, Helvetica, sans-serif" font-size="13">Part 4</text>
  </g>
</svg>
